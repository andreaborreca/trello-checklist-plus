<!DOCTYPE html>
<!-- Checklist+ export popover, opened from the "Esporta" action of the card section. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Esporta</title>
  <link rel="stylesheet" href="./css/section.css?v=1.5.1">
</head>
<body class="cp-popup-body">
  <div id="cp-export" class="cp-popup">
    <p class="cp-popup-info">Esporta tutte le Checklist+ della bacheca in CSV: card, checklist con i totali, task.</p>
    <p id="cp-export-status" class="cp-export-status">Lettura delle card in corso...</p>
    <p id="cp-popup-error" class="cp-error" hidden></p>
    <a id="cp-export-download" class="cp-btn cp-btn-primary cp-btn-block cp-btn-link" hidden>Scarica CSV</a>
    <button type="button" id="cp-export-copy" class="cp-btn cp-btn-block" hidden>Copia negli appunti</button>
  </div>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./vendor/lz-string.min.js?v=1.5.1"></script>
  <script src="./js/workdays.js?v=1.5.1"></script>
  <script src="./js/calc.js?v=1.5.1"></script>
  <script src="./js/store.js?v=1.5.1"></script>
  <script src="./js/exportcsv.js?v=1.5.1"></script>
  <script src="./js/export.js?v=1.5.1"></script>
</body>
</html>
