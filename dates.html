<!DOCTYPE html>
<!-- Checklist+ dates popover, opened with t.popup() inside Trello's own popover frame. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Date</title>
  <link rel="stylesheet" href="./css/section.css">
</head>
<body class="cp-popup-body">
  <form id="cp-dates" class="cp-popup" autocomplete="off" novalidate>
    <label class="cp-popup-field">
      <span>Data di inizio</span>
      <input id="cp-s" type="date">
    </label>
    <label class="cp-popup-field">
      <span>Deadline</span>
      <input id="cp-dl" type="date">
    </label>
    <label class="cp-popup-field">
      <span>Data di fine</span>
      <input id="cp-e" type="date">
    </label>
    <p id="cp-info" class="cp-popup-info"></p>
    <p id="cp-popup-error" class="cp-error" hidden></p>
    <button type="submit" class="cp-btn cp-btn-primary cp-btn-block">Salva</button>
    <button type="button" id="cp-clear" class="cp-btn cp-btn-block">Rimuovi</button>
  </form>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./vendor/lz-string.min.js"></script>
  <script src="./js/workdays.js"></script>
  <script src="./js/calc.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/dates.js"></script>
</body>
</html>
