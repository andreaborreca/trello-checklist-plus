<!DOCTYPE html>
<!-- Checklist+ single-date popover (start, deadline or end), modeled on Trello's "Modifica scadenza". -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Data</title>
  <link rel="stylesheet" href="./css/section.css?v=1.13.2">
</head>
<body class="cp-popup-body">
  <form id="cp-dates" class="cp-popup cp-cal-popup" autocomplete="off" novalidate>
    <div class="cp-cal-nav">
      <button type="button" class="cp-cal-navbtn" data-nav="-12" aria-label="Anno precedente">&laquo;</button>
      <button type="button" class="cp-cal-navbtn" data-nav="-1" aria-label="Mese precedente">&lsaquo;</button>
      <span id="cp-cal-title" class="cp-cal-title" aria-live="polite"></span>
      <button type="button" class="cp-cal-navbtn" data-nav="1" aria-label="Mese successivo">&rsaquo;</button>
      <button type="button" class="cp-cal-navbtn" data-nav="12" aria-label="Anno successivo">&raquo;</button>
    </div>
    <div id="cp-cal-grid" class="cp-cal-grid" role="grid"></div>

    <label class="cp-popup-field">
      <span id="cp-date-label">Data</span>
      <input id="cp-date-input" type="text" inputmode="numeric" placeholder="G/M/AAAA" maxlength="10">
    </label>
    <p id="cp-info" class="cp-popup-info" hidden></p>
    <p id="cp-popup-error" class="cp-error" hidden></p>
    <button type="submit" class="cp-btn cp-btn-primary cp-btn-block">Salva</button>
    <button type="button" id="cp-clear" class="cp-btn cp-btn-block">Rimuovi</button>
  </form>

  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/theme.js?v=1.13.2"></script>
  <script src="./vendor/lz-string.min.js?v=1.13.2"></script>
  <script src="./js/workdays.js?v=1.13.2"></script>
  <script src="./js/calc.js?v=1.13.2"></script>
  <script src="./js/store.js?v=1.13.2"></script>
  <script src="./js/popcommon.js?v=1.13.2"></script>
  <script src="./js/dates.js?v=1.13.2"></script>
</body>
</html>
