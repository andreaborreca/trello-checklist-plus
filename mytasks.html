<!DOCTYPE html>
<!-- Checklist+ popover: tasks assigned to a member across the board. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>I miei task</title>
  <link rel="stylesheet" href="./css/section.css?v=1.16.0">
</head>
<body class="cp-popup-body">
  <div id="cp-mytasks" class="cp-popup">
    <label class="cp-popup-field">
      <span>Membro</span>
      <select id="cp-mt-member"></select>
    </label>
    <label class="cp-export-month">
      <input type="checkbox" id="cp-mt-open" checked>
      <span>Solo i task da completare</span>
    </label>
    <p id="cp-mt-status" class="cp-export-status">Lettura delle card in corso...</p>
    <p id="cp-popup-error" class="cp-error" hidden></p>
    <div id="cp-mt-list"></div>
  </div>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/theme.js?v=1.16.0"></script>
  <script src="./vendor/lz-string.min.js?v=1.16.0"></script>
  <script src="./js/workdays.js?v=1.16.0"></script>
  <script src="./js/calc.js?v=1.16.0"></script>
  <script src="./js/store.js?v=1.16.0"></script>
  <script src="./js/people.js?v=1.16.0"></script>
  <script src="./js/popcommon.js?v=1.16.0"></script>
  <script src="./js/mytasks.js?v=1.16.0"></script>
</body>
</html>
