<!DOCTYPE html>
<!-- Checklist+ popover: client of a checklist and the board's client list. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Cliente</title>
  <link rel="stylesheet" href="./css/section.css?v=1.13.2">
</head>
<body class="cp-popup-body">
  <form id="cp-clients" class="cp-popup" autocomplete="off" novalidate>
    <label class="cp-export-month"><input type="radio" name="mode" id="cp-client-auto"> <span id="cp-client-auto-label">Automatico dal titolo</span></label>
    <label class="cp-export-month"><input type="radio" name="mode" id="cp-client-none"> <span>Nessun cliente (attività interna)</span></label>
    <label class="cp-export-month"><input type="radio" name="mode" id="cp-client-manual"> <span>Scelgo io (anche più di uno):</span></label>
    <div id="cp-client-list" class="cp-client-list"></div>
    <p id="cp-client-empty" class="cp-popup-info" hidden>L'elenco dei clienti della bacheca è vuoto: aggiungili qui sotto.</p>
    <p id="cp-popup-error" class="cp-error" hidden></p>
    <button type="submit" class="cp-btn cp-btn-primary cp-btn-block">Salva</button>
    <button type="button" id="cp-client-manage" class="cp-btn cp-btn-subtle cp-btn-block">Modifica elenco clienti</button>
    <div id="cp-client-editor" hidden>
      <label class="cp-popup-field">
        <span>Clienti della bacheca, uno per riga</span>
        <textarea id="cp-client-text" class="cp-edit-text" rows="6" maxlength="4000"></textarea>
      </label>
      <button type="button" id="cp-client-save-list" class="cp-btn cp-btn-block">Salva elenco</button>
    </div>
  </form>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/theme.js?v=1.13.2"></script>
  <script src="./vendor/lz-string.min.js?v=1.13.2"></script>
  <script src="./js/workdays.js?v=1.13.2"></script>
  <script src="./js/calc.js?v=1.13.2"></script>
  <script src="./js/store.js?v=1.13.2"></script>
  <script src="./js/people.js?v=1.13.2"></script>
  <script src="./js/popcommon.js?v=1.13.2"></script>
  <script src="./js/clients.js?v=1.13.2"></script>
</body>
</html>
